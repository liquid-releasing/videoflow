[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videoflow"
version = "0.0.7"
description = "Audio analysis + funscript generation engine — beats, phrase classification, curve shaping. Powers forgegen's audio-to-funscript pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Liquid Releasing", email = "lqr@liquidreleasing.com" },
]
keywords = ["funscript", "haptics", "beat-detection", "audio-analysis", "librosa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = []

[project.optional-dependencies]
scenes = ["scenedetect[opencv]>=0.6"]
audio = ["librosa>=0.10", "numpy>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "numpy>=1.24"]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/liquid-releasing/videoflow"
Repository = "https://github.com/liquid-releasing/videoflow"
Issues = "https://github.com/liquid-releasing/videoflow/issues"

[project.scripts]
videoflow = "videoflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videoflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
